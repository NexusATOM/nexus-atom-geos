name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      MPLCONFIGDIR: /tmp/atom-matplotlib
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexus-atom-geos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check out sibling protocol implementations
        shell: python
        run: |
          import pathlib, subprocess
          for name in ('core','controller','agents','hpc','science','geos'):
              repo='nexus-atom-'+name
              if not pathlib.Path(repo).exists():
                  subprocess.run(['git','clone','--depth','1','https://github.com/NexusATOM/'+repo+'.git',repo],check=True)
      - name: Install workspace and test dependencies
        run: >-
          python -m pip install
          -e './nexus-atom-core[dev]'
          -e './nexus-atom-controller[dev]'
          -e './nexus-atom-agents[dev,nooa,openai]'
          -e './nexus-atom-hpc[dev]'
          -e './nexus-atom-science[dev,netcdf,plots]'
          -e './nexus-atom-geos[dev,nooa]'
      - run: ruff check src tests examples/*.py examples/legacy/*.py scripts
        working-directory: nexus-atom-geos
      - run: ruff format --check src tests examples/*.py examples/legacy/*.py scripts
        working-directory: nexus-atom-geos
      - run: python -m pytest tests -q --cov=geos_agents --cov-fail-under=80
        working-directory: nexus-atom-geos
      - run: python -m build
        working-directory: nexus-atom-geos
      - run: python scripts/check_migration.py
        working-directory: nexus-atom-geos
      - name: Run migrated GEOS Agent examples
        working-directory: nexus-atom-geos
        run: |
          python examples/legacy/run_agents_demo.py
          python examples/legacy/run_agents_demo.py --with-specialists
          python examples/legacy/run_engineering_demo.py
      - name: Run synthetic debug workflow
        working-directory: nexus-atom-geos
        run: |
          python examples/debug_demo.py /tmp/atom-debug-example
          atom run --system geos --config /tmp/atom-debug-example/debug.yaml --state /tmp/atom-debug-example/state 'Repair the synthetic bug'
      - name: Run ATOM specialist workflow
        working-directory: nexus-atom-geos
        run: |
          python examples/atom_specialists_demo.py /tmp/atom-specialists-demo
          atom run --system geos --config /tmp/atom-specialists-demo/specialists.yaml --state /tmp/atom-specialists-demo/state 'Review and optimize the synthetic kernel'
      - name: Build shared libraries for isolated wheel check
        run: |
          python -m build nexus-atom-core
          python -m build nexus-atom-agents
          python -m build nexus-atom-hpc
          python -m build nexus-atom-science
      - name: Verify installed GEOS Agent without Controller
        run: |
          python -m venv /tmp/geos-wheel-check
          /tmp/geos-wheel-check/bin/python -m pip install \
            nexus-atom-core/dist/*.whl nexus-atom-agents/dist/*.whl \
            nexus-atom-hpc/dist/*.whl nexus-atom-science/dist/*.whl \
            nexus-atom-geos/dist/*.whl 'nooa==0.0.10'
          /tmp/geos-wheel-check/bin/geos-agent --version
          /tmp/geos-wheel-check/bin/python nexus-atom-geos/examples/legacy/check_installed_package.py
          /tmp/geos-wheel-check/bin/python nexus-atom-geos/examples/legacy/run_agents_demo.py --with-specialists
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-atom-geos-python-${{ matrix.python }}
          path: nexus-atom-geos/dist/*
