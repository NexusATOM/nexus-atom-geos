name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.16
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests examples/*.py
      - run: uv run --no-sync ruff format --check src tests examples/*.py
      - run: uv run --no-sync pytest --cov=geos_agents --cov-report=term-missing --cov-fail-under=80
      - run: uv run --no-sync python examples/run_engineering_demo.py
      - run: uv run --no-sync python examples/run_agents_demo.py
      - run: uv build
      - name: Install wheel in a fresh environment and check CLI
        run: |
          uv venv /tmp/geos-wheel-check
          uv pip install --python /tmp/geos-wheel-check/bin/python dist/*.whl
          /tmp/geos-wheel-check/bin/geos-agent --version
          /tmp/geos-wheel-check/bin/geos-agent catalog
          /tmp/geos-wheel-check/bin/python examples/check_installed_package.py
