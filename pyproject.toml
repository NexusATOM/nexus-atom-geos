[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-geos-agent"
version = "0.1.0a3"
description = "Evidence-driven GEOS engineering agents built on NVIDIA NOOA"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["nooa==0.0.10", "pydantic>=2.5,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
geos-agent = "geos_agents.cli:main"

[project.urls]
Repository = "https://github.com/nasa-nccs-hpda/nexus-geos-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/geos_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
